schema_version: 1
platform: disney
language: ko
kind: sdh
status: complete
source:
  official: false
  client: "작업자 실무 자료 (rules/sources/작업자-자료 / 작업 기본 원칙)"
  section: "디즈니+ 한국어 SDH 실무 기준"
  revision: "2026-08-11"
  verified: "2026-08-11"

# 디즈니+의 공식 스타일 가이드는 파트너 전용 비공개 문서다(disney/UNAVAILABLE.yaml).
# 이 프로파일은 작업자가 실제 납품하며 정리한 기준이다.
#
# 수치는 자료의 [스펙] 표(문서 안 이미지)에서 읽었다. 넷플릭스와 같다.

extends: common.yaml

sound_effect:
  enclosure: "[]"
  discouraged_expressions: ["[정적]", "[조용해진다]", "[조용하다]"]
  # 넷플릭스와 형식이 다르다. 디즈니는 의성어 뒤에 **상황을 서술**하고 `~ 소리`로
  # 끝나도 된다 — 넷플릭스가 지양하는 표기가 디즈니에서는 정답이다.
  style: onomatopoeia_plus_description     # [쾅 문 닫는 소리], [쨍 건배하는 소리]
  descriptive_form_allowed: true           # [한숨 쉬며] 내가 못 살아 (o)
  omit_when_visible: true

forced_narrative:
  translate_if_plot_pertinent_and_foreign: true
  korean_title_cards: not_needed
  overlap_with_dialogue: delete_forced_narrative

songs:
  lyrics_with_dialogue_in_one_event: forbidden   # 가사와 대사를 한 셀에 넣지 않는다
  forbidden_punctuation: []                      # 가사에 쉼표를 써도 된다

censorship:
  allowed: false
  bleeped_word: "O"                 # 넷플릭스·쿠팡은 별표, 디즈니만 대문자 O
  full_sentence_bleep: "[음 소거 효과음]"

music:
  note_inside_bracket: true         # [♪ 잔잔한 음악] — 넷플릭스·쿠팡은 넣지 않는다
  music_note: "♪"
  space_between_note_and_text: true


rules:
  - id: DP18
    clause: "실무 기준 / 노래"
    check: lyrics_with_dialogue
    auto: false
    message: "가사와 대사를 한 자막에 넣지 않습니다."
  - id: DP12
    clause: "실무 기준 / 배경음악"
    check: music_marker_style
    auto: false
    message: "디즈니는 음악 효과음 대괄호 안에 ♪를 넣습니다."
  - id: DP13
    clause: "실무 기준 / 음 소거"
    check: bleep_mask_character
    auto: false
    message: "디즈니는 삐 처리를 대문자 O로 합니다."
  - id: DP14
    clause: "실무 기준 / 음 소거"
    check: full_bleep_style
    auto: false
    message: "여러 단어가 삐 처리되면 [음 소거 효과음]으로 씁니다."
  - id: DP11
    clause: "실무 기준 / 효과음"
    check: sound_effect_multiline
    auto: false
    message: "효과음은 한 줄로 씁니다."
  - id: DP01
    clause: "실무 기준 / 화자명·효과음 표기"
    check: speaker_effect_no_space
    auto: false
    message: "표시와 표시 사이를 한 칸 띄웁니다."
  - id: DP02
    clause: "실무 기준 / 효과음"
    check: discouraged_silence_expression
    auto: false
    message: "[정적]·[조용해진다] 같은 표현은 지양합니다."
