schema_version: 1
platform: disney
language: ko
kind: sdh
status: complete
source:
  official: false
  client: "작업자 실무 자료 (rules/sources/작업자-자료 / 작업 기본 원칙)"
  section: "디즈니+ 한국어 SDH 실무 기준"
  revision: "2026-08-11"
  verified: "2026-08-11"

# 디즈니+의 공식 스타일 가이드는 파트너 전용 비공개 문서다(disney/UNAVAILABLE.yaml).
# 이 프로파일은 작업자가 실제 납품하며 정리한 기준이다.
#
# 수치는 자료의 [스펙] 표(문서 안 이미지)에서 읽었다. 넷플릭스와 같다.

limits:
  chars_per_line: 16
  char_weights:
    cjk: 1.0
    other: 0.5
  reading_speed_cps:
    adult: 14
    children: 11
  max_lines: 2
  duration_ms:
    min: 834
    max: 7000
  min_gap_frames: 2

speaker_id:
  enclosure: "[]"
  numbering_reset: scene          # 씬이 바뀌면 초기화(넷플릭스와 같다)
  in_point_basis: shot_change     # 장면 전환 기준(얼굴이 보이면 화자명 불필요)
  space_between_markers: true

sound_effect:
  enclosure: "[]"
  discouraged_expressions: ["[정적]", "[조용해진다]", "[조용하다]"]
  omit_when_visible: true

shot_change:
  applied: true
  in_point: "장면 전환에 딱 맞추거나 0.5초 이상 벌린다"
  out_point: "장면 전환 -2프레임에 맞추거나 0.5초 이상 벌린다"

text:
  # 전각 말줄임표와 온점 셋 중 어느 쪽이든 되지만 **한 작업물 안에서 통일**해야 한다.
  # 발주처가 정해 주는 경우가 많고, 말이 없으면 반드시 물어볼 것.
  ellipsis_char: null                # 전각·점 셋 둘 다 되지만 작업물 내 통일
  ellipsis_consistency_required: true
  double_punctuation: forbidden
  tilde: forbidden
  italics: forbidden
  line_break: "적당히 보기 좋게"

songs:
  lyrics_with_dialogue_in_one_event: forbidden   # 가사와 대사를 한 셀에 넣지 않는다

censorship:
  allowed: false
  full_sentence_bleep: "[음 소거 효과음]"

top_position:
  applied: true

rules:
  - id: DP00
    clause: "실무 스펙 / 듀레이션·글자 수"
    check: [duration_out_of_range, line_length_exceeded, reading_speed_exceeded]
    auto: false
    message: "디즈니 스펙(0.834~7초, {chars_per_line}자, {cps_adult} CPS)을 벗어납니다."
  - id: DP07
    clause: "실무 스펙 / 자막 간격"
    check: gap_too_short
    auto: false
    message: "자막 사이를 2프레임 이상 벌립니다."
  - id: DP08
    clause: "실무 기준 / 문장부호"
    check: ellipsis_style_inconsistent
    auto: false
    message: "말줄임표 표기가 섞였습니다. 작업물 안에서 통일합니다."
  - id: DP09
    clause: "실무 기준 / 문장부호"
    check: double_punctuation
    auto: false
    message: "이중 부호를 쓰지 않습니다."
  - id: DP10
    clause: "실무 기준 / 문장부호"
    check: tilde_used
    auto: false
    message: "물결표를 쓰지 않습니다."
  - id: DP11
    clause: "실무 기준 / 효과음"
    check: sound_effect_multiline
    auto: false
    message: "효과음은 한 줄로 씁니다."
  - id: DP01
    clause: "실무 기준 / 화자명·효과음 표기"
    check: speaker_effect_no_space
    auto: false
    message: "표시와 표시 사이를 한 칸 띄웁니다."
  - id: DP02
    clause: "실무 기준 / 효과음"
    check: discouraged_silence_expression
    auto: false
    message: "[정적]·[조용해진다] 같은 표현은 지양합니다."
  - id: DP03
    clause: "General / Line Treatment"
    check: too_many_lines
    auto: false
    message: "자막은 최대 {max_lines}줄입니다."
  - id: DP04
    clause: "실무 기준 / 단위 표기"
    check: unit_composed_character
    auto: false
    message: "단위는 조합 문자를 쓰지 않고 풀어 씁니다."
  - id: DP05
    clause: "실무 기준 / 줄바꿈"
    check: line_break_position
    auto: false
    message: "줄바꿈이 문법 단위를 끊었습니다."
  - id: DP06
    clause: "실무 기준 / 노래"
    check: music_note_spacing
    auto: true
    message: "음표 앞뒤로 한 칸씩 띄웁니다."
