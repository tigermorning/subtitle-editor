schema_version: 1
platform: disney
language: ko
kind: translation
status: complete

# **공통부를 상속한다.** 작업자 지적(2026-08-11): 번역 자막에서 달라지는 것은
# 화면자막 표식과 겹침 처리 두 가지뿐이고, **화자명·어조 표기는 SDH와 같다.**
#
# 그래도 SDH 프로파일을 직접 상속하지는 않는다 — 그러면 효과음·음 소거 규칙까지
# 딸려 와 두 규정이 섞인다. 종류를 가리지 않는 부분만 common.yaml에 두고 양쪽이
# 그것을 상속한다(상속은 kind: common이거나 같은 kind여야 한다는 계약 그대로).
extends: common.yaml

source:
  official: false
  client: "작업자 실무 자료 — 작업 기본 원칙 [영상번역] 절"
  section: "디즈니+ 한국어 번역 자막 실무 기준"
  note: >
    디즈니+ 공식 번역 가이드 문건은 확보하지 못했다. 이 프로파일은 작업자가 실제
    작업에서 쓰는 기준이며, 발주처가 다른 값을 주면 그쪽이 우선이다.
    공식 문건을 구하면 official 프로파일로 갈아 끼운다.

forced_narrative:
  # **작업 시작 전에 고른다.** 업체마다 다르고 같은 업체도 작업마다 달라진다.
  marker: ask                       # double_quote | italic | bracket | none

collision:
  # [영상번역] 677행 "말자막이 화면자막보다 우선! 둘이 겹치면 말자막 번역"이 기본이고,
  # 플랫폼 대조표(WORK-030)도 **디즈니는 화면자막 삭제**라고 값을 준다.
  # 678행처럼 둘 다 따로 잡으라는 업체가 있으므로 `--collision`으로 덮을 수 있게 두되,
  # **기본값을 ask로 두지는 않는다** — 자료에 답이 있는데 묻는 것이었다(2026-08-14 정정).
  policy: dialogue_only             # move_dialogue | dialogue_only | keep_both
  move_to: top_center               # move_dialogue일 때 말자막이 갈 자리

rules:
  - id: DT01
    clause: "작업자 자료 / [영상번역] 문장부호"
    check: line_end_period_or_comma
    auto: false
    message: "번역 자막은 마침표를 쓰지 않고, 문장 끝에 쉼표도 쓰지 않습니다."
  - id: DT02
    clause: "작업자 자료 / [영상번역] 문장부호"
    check: dialogue_double_quote
    auto: false
    message: "말자막에는 큰따옴표를 쓰지 않습니다(화면자막에는 규칙에 따라 쓸 수 있습니다)."
  - id: DT03
    clause: "작업자 자료 / [영상번역] 이중 화자"
    check: dual_speaker_marker_format
    auto: false
    message: "두 사람의 대화는 하이픈으로 구분합니다."
