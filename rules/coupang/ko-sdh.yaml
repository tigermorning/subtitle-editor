schema_version: 1
platform: coupang
language: ko
kind: sdh
status: complete
source:
  official: false
  client: "작업자 실무 자료 (rules/sources/작업자-자료 / 작업 기본 원칙)"
  section: "쿠팡플레이 한국어 SDH 실무 기준"
  revision: "2026-08-11"
  verified: "2026-08-11"

# 쿠팡플레이는 공식 자막 제작 가이드를 공개하지 않는다(coupang/UNAVAILABLE.yaml 참고).
# 이 프로파일은 **작업자가 실제 납품하며 정리한 기준**이다. 공식 문서가 아니므로
# source.client로 출처를 밝힌다.
#
# 수치는 자료의 [스펙] 표(문서 안 이미지)에서 읽었다. 넷플릭스·디즈니와 다른 곳:
# 듀레이션 상한이 6초이고, 불가피할 때 CPL 20자·3줄까지 열어 둔다.

limits:
  chars_per_line: 16          # 불가피할 경우 20자까지 (사람이 판단할 예외)
  chars_per_line_hard: 20
  char_weights:
    cjk: 1.0
    other: 0.5
  reading_speed_cps:
    adult: 14
    children: 11
  max_lines: 2                # 불가피할 경우 3줄까지
  max_lines_hard: 3
  duration_ms:
    min: 834
    max: 6000                 # 넷플릭스·디즈니는 7초, 쿠팡만 6초
  min_gap_frames: 2

speaker_id:
  # 넷플릭스·디즈니는 대괄호, **쿠팡은 소괄호**로 화자명을 쓴다.
  # 효과음은 셋 다 대괄호다: (철수) [작게], (철수) [영어]
  enclosure: "()"
  style: "(이름) [어조] [언어]"
  foreign_return_marker: true          # 한국어로 돌아오면 [한국어] 표시
  numbering_reset: episode      # 넷플릭스·디즈니와 다르다 — 에피소드 내내 번호 유지
  in_point_basis: dialogue_start  # 대사 시작 기준(얼굴이 안 보이면 화자명 삽입)
  space_between_markers: true

sound_effect:
  enclosure: "[]"
  discouraged_expressions: ["[정적]", "[조용해진다]", "[조용하다]"]
  after_dialogue: forbidden     # 대사 뒤 효과음 금지 — 넷플릭스만 허용한다
  omit_when_visible: true

shot_change:
  applied: false                # 쿠팡은 장면 전환을 적용하지 않는다

censorship:
  allowed: false
  bleeped_word: "*"
  full_sentence_bleep: "[음 소거 효과음]"   # 넷플릭스는 별표를 늘어놓는다

music:
  note_inside_bracket: false        # 음악 효과음에 ♪를 넣지 않는다
  music_note: "♪"
  space_between_note_and_text: true

korean:
  orthography: standard             # 표준어와 비슷하면 표준어로(`네가`·`그렇지`)
  dialect: keep

songs:
  # 넷플릭스·디즈니는 가사에 쉼표를 허용하지만 쿠팡은 금지한다.
  # 내 피, 땀, 눈물 (x) -> 내 피 땀 눈물 (o)
  forbidden_punctuation: [",", "'", '"', "”", "“"]
  lyrics_with_dialogue_in_one_event: allowed

credit:
  translator_credit: required        # 자막: 홍길동
  credit_duration_ms: 2000

delivery:
  first_cue_not_at_zero: true        # 첫 셀 인점 00:00:00:00 불가
  file_format: webvtt
  line_position_percent: 10     # WebVTT 속성 상/중 line 10%

forced_narrative:
  translate_if_plot_pertinent_and_foreign: true
  korean_title_cards: not_needed
  # 넷플릭스·디즈니는 대사와 겹치면 화면 자막을 지운다. **쿠팡은 지우지 않고**
  # 화면 자막을 위에 배치해 대사와 함께 보여 준다.
  overlap_with_dialogue: keep_both_top_position

burned_in_caption:
  # (예능) 번인 화면 자막이 대사와 같으면 대사를 적지 않는다.
  # 필요하면 화자명만 더하고, 인점·아웃점은 번인 자막에 맞춘다.
  same_as_dialogue: omit_dialogue
  add_speaker_id_if_needed: true
  timing: match_burned_in

top_position:
  applied: true

text:
  ellipsis_char: "..."              # 쿠팡은 점 셋 — 넷플릭스와 정반대다
  double_punctuation: forbidden
  tilde: forbidden
  italics: forbidden
  line_break: "적당히 보기 좋게"     # 넷플릭스의 '16자 이하 한 줄' 규정은 없다               # 화면 텍스트와 겹치면 상단 처리

rules:
  - id: CP00
    clause: "실무 스펙 / 듀레이션·글자 수"
    check: [duration_out_of_range, line_length_exceeded, reading_speed_exceeded]
    auto: false
    message: "쿠팡 스펙(0.834~6초, {chars_per_line}자, {cps_adult} CPS)을 벗어납니다."
  - id: CP08
    clause: "실무 스펙 / 자막 간격"
    check: gap_too_short
    auto: false
    message: "자막 사이를 2프레임 이상 벌립니다."
  - id: CP15
    clause: "실무 기준 / 음 소거"
    check: bleep_mask_character
    auto: false
    message: "삐 처리는 별표(*)로 합니다."
  - id: CP19
    clause: "실무 기준 / 노래"
    check: lyrics_punctuation
    auto: false
    message: "쿠팡은 가사에 쉼표·따옴표를 쓰지 않습니다."
  - id: CP20
    clause: "실무 기준 / 납품"
    check: first_event_at_zero
    auto: false
    message: "첫 자막 인점을 00:00:00:00으로 두지 않습니다."
  - id: CP16
    clause: "실무 기준 / 화자명"
    check: speaker_id_enclosure
    auto: false
    message: "쿠팡은 화자명을 소괄호로 씁니다."
  - id: CP17
    clause: "실무 기준 / 화자명"
    check: speaker_id_conjunction
    auto: false
    message: "동시 발화는 쉼표로 나열하거나 [함께]로 씁니다."
  - id: CP18
    clause: "실무 기준 / 화자명"
    check: speaker_id_alone_on_line
    auto: false
    message: "화자명과 대사 첫마디는 같은 줄에 둡니다."
  - id: CP13
    clause: "실무 기준 / 배경음악"
    check: music_marker_style
    auto: false
    message: "음악 효과음 대괄호 안에 ♪를 넣지 않습니다."
  - id: CP14
    clause: "실무 기준 / 음 소거"
    check: full_bleep_style
    auto: false
    message: "여러 단어가 삐 처리되면 [음 소거 효과음]으로 씁니다."
  - id: CP09
    clause: "실무 기준 / 문장부호"
    check: ellipsis_style_mismatch
    auto: true
    message: "쿠팡은 점 셋(...)을 씁니다."
  - id: CP10
    clause: "실무 기준 / 문장부호"
    check: double_punctuation
    auto: false
    message: "이중 부호를 쓰지 않습니다."
  - id: CP11
    clause: "실무 기준 / 문장부호"
    check: tilde_used
    auto: false
    message: "물결표를 쓰지 않습니다."
  - id: CP12
    clause: "실무 기준 / 효과음"
    check: sound_effect_multiline
    auto: false
    message: "효과음은 한 줄로 씁니다."
  - id: CP01
    clause: "실무 기준 / 효과음"
    check: effect_after_dialogue
    auto: false
    message: "쿠팡은 대사 뒤 효과음을 허용하지 않습니다. 자막을 나누세요."
  - id: CP02
    clause: "실무 기준 / 화자명·효과음 표기"
    check: speaker_effect_no_space
    auto: false
    message: "표시와 표시 사이를 한 칸 띄웁니다."
  - id: CP03
    clause: "실무 기준 / 효과음"
    check: discouraged_silence_expression
    auto: false
    message: "[정적]·[조용해진다] 같은 표현은 지양합니다."
  - id: CP04
    clause: "General / Line Treatment"
    check: too_many_lines
    auto: false
    message: "자막은 최대 {max_lines}줄입니다."
  - id: CP05
    clause: "실무 기준 / 단위 표기"
    check: unit_composed_character
    auto: false
    message: "단위는 조합 문자를 쓰지 않고 풀어 씁니다."
  - id: CP06
    clause: "실무 기준 / 줄바꿈"
    check: line_break_position
    auto: false
    message: "줄바꿈이 문법 단위를 끊었습니다."
  - id: CP07
    clause: "실무 기준 / 노래"
    check: music_note_spacing
    auto: true
    message: "음표 앞뒤로 한 칸씩 띄웁니다."
