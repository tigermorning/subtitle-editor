schema_version: 1
platform: netflix
language: ko
kind: sdh
extends: ko-sdh.yaml
status: complete
source:
  official: false
  client: "작업자 실무 자료 (rules/sources/작업자-자료)"
  section: "넷플릭스 한국어 SDH 공식 규정 + 실무 관행"
  revision: "2026-08-11"
  verified: "2026-08-11"

# 공식 프로파일(ko-sdh.yaml)에 **실무에서 쌓인 규칙**을 얹은 판이다.
# 공식 문서에 없거나 명시되지 않았지만 납품 현장에서 지키는 것들이라 출처를 갈라 둔다.
# 공식 값만 쓰고 싶으면 ko-sdh.yaml을 쓰면 된다.

limits:
  # 넷플릭스 공식 General Requirements는 프레임 갭 규정을 삭제했다(2020-07-24
  # "Timing and frame gap sections removed"). 그러나 실무에서는 2프레임을 지킨다.
  # 공식 판(ko-sdh.yaml)에는 넣지 않고 이 실무 판에만 둔다.
  min_gap_frames: 2

top_position:
  applied: true

text:
  ellipsis_char: "…"                # 넷플릭스는 전각 기호
  double_punctuation: limited       # ?! 는 되지만 남용 금지
  tilde: limited                    # 오~ 정도만, 남용 금지
  line_break_single_if_under: 16    # 16자 이하는 한 줄로

sound_effect:
  discouraged_expressions: ["[정적]", "[조용해진다]", "[조용하다]"]
  onomatopoeia_form: "[의성어 - 출처]"      # 예: [직 - 지퍼], [달칵 - 문]
  omit_when_visible: true                  # 화면에 동작이 보이면 효과음 생략

speaker_id:
  numbering_reset: scene                   # 씬이 바뀌면 화자 번호 초기화
  insert_on_first_line_of_speaker: true    # 화자의 첫 셀에만, 시공간 바뀌면 다시
  space_between_markers: true              # [화자명] [효과음] 사이 한 칸

shot_change:
  applied: true
  in_point: "장면 전환에 딱 맞추거나 0.5초 이상 벌린다"
  out_point: "장면 전환 -2프레임에 맞추거나 0.5초 이상 벌린다"

rules:
  - id: S18
    clause: "실무 자료 / 화자명·효과음 표기"
    check: speaker_effect_no_space
    auto: false
    message: "표시와 표시 사이를 한 칸 띄웁니다."
  - id: S19
    clause: "실무 자료 / 효과음"
    check: discouraged_silence_expression
    auto: false
    message: "[정적]·[조용해진다] 같은 표현은 지양합니다."
  - id: S20
    clause: "실무 자료 / 단위 표기"
    check: unit_composed_character
    auto: false
    message: "단위는 조합 문자를 쓰지 않고 풀어 씁니다."
  - id: S21
    clause: "실무 자료 / 문장부호"
    check: ampersand_outside_initialism
    auto: false
    message: "'&'는 및·겸·쉼표로 바꿉니다."
  - id: S24
    clause: "실무 자료 / 문장부호"
    check: ellipsis_style_mismatch
    auto: true
    message: "넷플릭스는 전각 말줄임표(…)를 씁니다."
  - id: S25
    clause: "실무 자료 / 효과음"
    check: sound_effect_multiline
    auto: false
    message: "효과음은 한 줄로 씁니다."
  - id: S23
    clause: "실무 스펙 / 자막 간격"
    check: gap_too_short
    auto: false
    message: "자막 사이를 2프레임 이상 벌립니다."
  - id: S22
    clause: "실무 자료 / 인명 표기"
    check: middle_initial_period
    auto: false
    message: "가운데 이름 뒤에는 온점을 찍지 않습니다."
