schema_version: 1
platform: netflix
language: ko
kind: sdh
extends: ko-sdh.yaml
status: complete
source:
  official: false
  client: "작업자 실무 자료 (rules/sources/작업자-자료)"
  section: "넷플릭스 한국어 SDH 공식 규정 + 실무 관행"
  revision: "2026-08-11"
  verified: "2026-08-11"

# 공식 프로파일(ko-sdh.yaml)에 **실무에서 쌓인 규칙**을 얹은 판이다.
# 공식 문서에 없거나 명시되지 않았지만 납품 현장에서 지키는 것들이라 출처를 갈라 둔다.
# 공식 값만 쓰고 싶으면 ko-sdh.yaml을 쓰면 된다.

limits:
  # 넷플릭스 공식 General Requirements는 프레임 갭 규정을 삭제했다(2020-07-24
  # "Timing and frame gap sections removed"). 그러나 실무에서는 2프레임을 지킨다.
  # 공식 판(ko-sdh.yaml)에는 넣지 않고 이 실무 판에만 둔다.
  min_gap_frames: 2

top_position:
  applied: true

songs:
  forbidden_punctuation: []
  lyrics_with_dialogue_in_one_event: allowed

numbers:
  # 6만~8만 명 (o) / 6~8만 명 (x) / 6만 ~ 8만 명 (x)
  range_notation_strict: true

credit:
  translator_credit: forbidden

censorship:
  allowed: false
  bleeped_word: "*"
  full_sentence_bleep: "asterisks"   # 별표를 늘어놓는다. [음 소거 효과음]은 쓰지 않는다

music:
  note_inside_bracket: false

korean:
  orthography: standard
  dialect: keep

text:
  no_comma_after_conjunctive_adverb: true   # 그러나, 또한, 사실, 뒤 쉼표 금지
  ellipsis_char: "…"                # 넷플릭스는 전각 기호
  double_punctuation: limited       # ?! 는 되지만 남용 금지
  tilde: limited                    # 오~ 정도만, 남용 금지
  line_break_single_if_under: 16    # 16자 이하는 한 줄로

sound_effect:
  discouraged_expressions: ["[정적]", "[조용해진다]", "[조용하다]"]
  style: onomatopoeia_plus_source          # [쾅 - 철문], [쨍 - 맥줏잔], [째깍째깍 - 효과음]
  onomatopoeia_form: "[의성어 - 출처]"
  prefer_dialogue_over_effect: true        # [한숨] 내가 못 살아 (x) -> 휴, 내가 못 살아 (o)
  omit_when_visible: true                  # 화면에 동작이 보이면 효과음 생략

speaker_id:
  enclosure: "[]"
  style: "[이름/어조/언어]"              # 디즈니는 서술형, 쿠팡은 소괄호
  prefer_role_over_gender: true         # [남자]·[여자]보다 [경비]·[종업원]
  foreign_return_marker: false          # 한국어로 돌아와도 [한국어]를 넣지 않는다
  transliteration_quotes: false         # 외국어 음차에 따옴표를 쓰지 않는다
  numbering_reset: scene                   # 씬이 바뀌면 화자 번호 초기화
  insert_on_first_line_of_speaker: true    # 화자의 첫 셀에만, 시공간 바뀌면 다시
  space_between_markers: true              # [화자명] [효과음] 사이 한 칸

forced_narrative:
  # 서사와 관련 있고 외국어면 번역해 화면 자막으로 잡는다.
  # 한국 작품은 메인 타이틀·에피 타이틀에 화면 자막이 필요 없다.
  translate_if_plot_pertinent_and_foreign: true
  korean_title_cards: not_needed
  overlap_with_dialogue: delete_forced_narrative

shot_change:
  applied: true
  in_point: "장면 전환에 딱 맞추거나 0.5초 이상 벌린다"
  out_point: "장면 전환 -2프레임에 맞추거나 0.5초 이상 벌린다"

rules:
  - id: S18
    clause: "실무 자료 / 화자명·효과음 표기"
    check: speaker_effect_no_space
    auto: false
    message: "표시와 표시 사이를 한 칸 띄웁니다."
  - id: S19
    clause: "실무 자료 / 효과음"
    check: discouraged_silence_expression
    auto: false
    message: "[정적]·[조용해진다] 같은 표현은 지양합니다."
  - id: S20
    clause: "실무 자료 / 단위 표기"
    check: unit_composed_character
    auto: false
    message: "단위는 조합 문자를 쓰지 않고 풀어 씁니다."
  - id: S21
    clause: "실무 자료 / 문장부호"
    check: ampersand_outside_initialism
    auto: false
    message: "'&'는 및·겸·쉼표로 바꿉니다."
  - id: S28
    clause: "실무 기준 / 음 소거"
    check: bleep_mask_character
    auto: false
    message: "삐 처리는 별표(*)로 합니다."
  - id: S33
    clause: "실무 자료 / 범위 표기"
    check: range_notation
    auto: false
    message: "범위는 양쪽에 단위를 붙이고 부호 앞뒤를 띄우지 않습니다."
  - id: S34
    clause: "실무 자료 / 문장부호"
    check: conjunctive_adverb_comma
    auto: false
    message: "접속부사 뒤에는 쉼표를 쓰지 않습니다."
  - id: S32
    clause: "실무 자료 / 크레딧"
    check: translator_credit_present
    auto: false
    message: "넷플릭스는 자막 제작자 크레딧을 넣지 않습니다."
  - id: S29
    clause: "실무 자료 / 화자명"
    check: speaker_id_enclosure
    auto: false
    message: "화자명은 대괄호로 씁니다."
  - id: S30
    clause: "실무 자료 / 화자명"
    check: speaker_id_conjunction
    auto: false
    message: "동시 발화는 쉼표로 나열하거나 [함께]로 씁니다."
  - id: S31
    clause: "실무 자료 / 화자명"
    check: speaker_id_alone_on_line
    auto: false
    message: "화자명과 대사 첫마디는 같은 줄에 둡니다."
  - id: S26
    clause: "실무 자료 / 배경음악"
    check: music_marker_style
    auto: false
    message: "음악 효과음 대괄호 안에 ♪를 넣지 않습니다."
  - id: S27
    clause: "실무 자료 / 음 소거"
    check: full_bleep_style
    auto: false
    message: "넷플릭스는 여러 단어 삐 처리에 [음 소거 효과음]을 쓰지 않습니다."
  - id: S24
    clause: "실무 자료 / 문장부호"
    check: ellipsis_style_mismatch
    auto: true
    message: "넷플릭스는 전각 말줄임표(…)를 씁니다."
  - id: S25
    clause: "실무 자료 / 효과음"
    check: sound_effect_multiline
    auto: false
    message: "효과음은 한 줄로 씁니다."
  - id: S23
    clause: "실무 스펙 / 자막 간격"
    check: gap_too_short
    auto: false
    message: "자막 사이를 2프레임 이상 벌립니다."
  - id: S22
    clause: "실무 자료 / 인명 표기"
    check: middle_initial_period
    auto: false
    message: "가운데 이름 뒤에는 온점을 찍지 않습니다."
