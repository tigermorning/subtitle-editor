schema_version: 1
platform: netflix
language: null
kind: common
status: complete
source:
  official: true
  url: "https://partnerhelp.netflixstudios.com/hc/en-us/articles/215758617-Timed-Text-Style-Guide-General-Requirements"
  section: "Timed Text Style Guide: General Requirements"
  revision: "2022-10-07"
  verified: "2026-08-11"

# SDH·번역 자막 양쪽에 공통 적용되는 층.
limits:
  max_lines: 2
  prefer_single_line: true
  duration_ms:
    min: 833      # 5/6초 (24fps 기준 20프레임)
    max: 7000

delivery:
  file_format: ttml1          # .xml / .ttml
  encoding: utf-8
  glyph_list: netflix         # Netflix Glyph List 외 문자 금지
  positioning:
    align: center
    anchor: [top, bottom]
    units: percent            # px 금지
    font_size_percent: 100

line_break:
  shape: bottom_heavy         # 여러 선택지가 있으면 아래 줄이 더 긴 형태
  break_after: [punctuation]
  break_before: [conjunction, preposition]
  never_split:
    - article_noun
    - adjective_noun
    - first_last_name
    - subject_pronoun_verb
    - prepositional_phrase
    - auxiliary_verb
    - reflexive_pronoun
    - negation

consistency:
  proper_nouns: knp           # 시즌·에피소드 간 KNP 테이블로 통일
  formality_table: true

rules:
  - id: C01
    clause: "General Requirements / Duration"
    check: duration_out_of_range
    auto: false
    message: "표시 시간이 {duration_min_ms}~{duration_max_ms}ms 범위를 벗어납니다."
  - id: C02
    clause: "General Requirements / Line Treatment"
    check: too_many_lines
    auto: false
    message: "자막은 최대 {max_lines}줄입니다."
  - id: C03
    clause: "General Requirements / Currency"
    check: currency_converted
    auto: false
    message: "통화를 환산하지 않습니다."
  - id: C04
    clause: "General Requirements / Glyph List"
    check: glyph_not_allowed
    auto: false
    message: "Netflix Glyph List에 없는 문자입니다."
  - id: C10
    clause: "General Requirements / Positioning"
    check: position_collides_with_forced_narrative
    auto: true
    message: "화면 글자와 겹칩니다. 말자막을 상단 중앙으로 올립니다(겹침이 끝나면 되돌립니다)."
  - id: C11
    clause: "작업 표기 / 화자명"
    check: colon_speaker_prefix
    auto: true
    message: "대본의 `이름:` 표기는 자막 표기가 아닙니다. `[이름]`으로 옮깁니다."
  - id: C12
    clause: "작업 표기 / 표시 띄어쓰기"
    check: space_between_markers
    auto: true
    message: "표시끼리는 붙여 씁니다. 한 칸은 마지막 표시와 대사 사이에만 둡니다."
  - id: C30
    clause: "작업자 첨삭 / 화폐 표기"
    check: currency_bul
    auto: true
    message: "화폐 단위 '불'은 쓰지 않습니다. '달러'로 적습니다."
  - id: C31
    clause: "작업자 첨삭 / 특수기호"
    check: special_symbol
    auto: false
    message: "자막에는 특수기호를 쓰지 않습니다. 말로 풀어 적습니다."
  - id: C32
    clause: "작업자 자료 / 숫자 표기"
    check: hangul_clock
    auto: false
    message: "시각은 아라비아 숫자로 적습니다."
  - id: C33
    clause: "작업자 자료 / 숫자 표기"
    check: hangul_number_ten_plus
    auto: false
    message: "10 이상은 아라비아 숫자로 적습니다(10 미만은 소리 나는 대로)."
